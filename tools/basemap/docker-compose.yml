services:
  tileserver:
    image: maptiler/tileserver-gl:v5.6.0@sha256:3a9ccdb24820b6814c8119bcc8a4376c39867cb0ffe69d62919ef898b90c2427
    container_name: busnav-tileserver
    command: ["--config", "/data/config/tileserver-config.json"]
    ports:
      - "${BUSNAV_TILESERVER_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - "${BUSNAV_BASEMAP_DATA_DIR:?set BUSNAV_BASEMAP_DATA_DIR}:/data/runtime:ro"
      - "./config:/data/config:ro"
      - "./style:/data/styles:ro"
    restart: unless-stopped

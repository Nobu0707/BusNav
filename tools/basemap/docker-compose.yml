services:
  tileserver:
    image: maptiler/tileserver-gl:v5.6.0
    container_name: busnav-tileserver
    command: ["--config", "/data/config/tileserver-config.json"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "${BUSNAV_BASEMAP_DATA_DIR:?set BUSNAV_BASEMAP_DATA_DIR}:/data/runtime:ro"
      - "./config:/data/config:ro"
      - "./style:/data/styles:ro"
    restart: unless-stopped
